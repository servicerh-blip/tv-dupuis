<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Radio Nova</title><style>html,body{height:100%;margin:0;font-family:Arial;background:#173447;color:#fff}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}button{font-size:30px;font-weight:bold;padding:22px 34px;border:0;border-radius:14px}audio{width:80%;max-width:700px}#s{font-size:20px}</style></head><body><main><h1>TEST RADIO NOVA</h1><button id="b">▶ TESTER RADIO NOVA</button><audio id="a" controls preload="none" src="https://novazz.ice.infomaniak.ch/novazz-128.mp3"></audio><div id="s">Clique sur le bouton pour tester le son.</div></main><script>const a=document.getElementById("a"),s=document.getElementById("s");document.getElementById("b").onclick=async()=>{s.textContent="Connexion…";try{await a.play();s.textContent="✅ Radio Nova est en lecture."}catch(e){s.textContent="❌ Lecture refusée : "+e.message}};a.onplaying=()=>s.textContent="✅ Radio Nova est en lecture.";a.onerror=()=>s.textContent="❌ Impossible de charger le flux audio.";</script></body></html>
